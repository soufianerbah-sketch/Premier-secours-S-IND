<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الإسعافات الأولية – SOMIPHOS</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--tx:#1f2a1f;--mut:#6b6b5a;--pri:#e0a800;--pri-tx:#1f1a00;--ok:#2e7d32;--okbg:#e3f4e4;--ko:#c62828;--kobg:#fde8e8;--bd:#e6dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a14;--card:#20261d;--tx:#f1f1e6;--mut:#a9ab98;--pri:#f0b90b;--pri-tx:#1f1a00;--ok:#7fd483;--okbg:#1e3a20;--ko:#ff8a80;--kobg:#442020;--bd:#363d31}}
:root[data-theme="dark"]{--bg:#161a14;--card:#20261d;--tx:#f1f1e6;--mut:#a9ab98;--pri:#f0b90b;--pri-tx:#1f1a00;--ok:#7fd483;--okbg:#1e3a20;--ko:#ff8a80;--kobg:#442020;--bd:#363d31}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100%;padding:12px}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:8px 12px}
header img{width:56px;height:56px;border-radius:8px}
header b{font-size:17px;color:#1f2a1f}header span{display:block;font-size:13px;color:#555}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut)}
h2{font-size:20px;line-height:1.6;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;font-size:17px;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt:disabled{cursor:default;color:var(--tx)}
.exp{margin:4px 0 12px;padding:10px 12px;border-radius:12px;background:var(--okbg);font-size:15px;line-height:1.7}
.btn{display:block;width:100%;font:inherit;font-size:18px;font-weight:700;background:var(--pri);color:var(--pri-tx);border:0;border-radius:12px;padding:13px;cursor:pointer}
.center{text-align:center}.big{font-size:44px;font-weight:800;margin:6px 0}
.hide{display:none}
.lg{margin-top:10px}.lg2{background:var(--card);color:var(--tx);border:2px solid var(--pri)}.stg{background:var(--pri);color:var(--pri-tx);border-radius:8px;padding:2px 10px;font-weight:700}</style>
</head>

[

const $=id=>document.getElementById(id);
let L="ar",n=0,s=0,flat=[];
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>["lang","start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id));
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{L=b.dataset.l;const r=$("root");r.lang=L;r.dir=L==="ar"?"rtl":"ltr";$("st").textContent=T[L].st;$("sd").textContent=T[L].sd;$("go").textContent=T[L].go;$("again").textContent=T[L].ag;show("start")});
function start(){n=0;s=0;flat=[];S.forEach((a,k)=>a.forEach(q=>flat.push({k,q})));show("game");load()}
function load(){
 const t=T[L],{k,q}=flat[n],o=L==="ar"?0:3;
 $("stg").textContent=t.stl+" "+(k+1)+"/4 · "+t.stg[k];$("num").textContent=t.q+" "+(n%4+1)+"/4";$("sc").textContent=t.sc+": "+s;
 $("pg").style.width=(n/flat.length*100)+"%";$("q").textContent=q[o];
 $("exp").classList.add("hide");$("next").classList.add("hide");
 const box=$("opts");box.innerHTML="";
 sh(q[o+1].map((x,j)=>({x,ok:j===0}))).forEach(p=>{const b=document.createElement("button");b.className="opt";b.textContent=p.x;b.onclick=()=>pick(b,p.ok);box.appendChild(b)});
}
function pick(b,ok){
 const t=T[L],q=flat[n].q,o=L==="ar"?0:3;
 [...$("opts").children].forEach(x=>{x.disabled=true;if(x.textContent===q[o+1][0])x.classList.add("ok")});
 if(ok)s++;else b.classList.add("ko");
 $("sc").textContent=t.sc+": "+s;
 $("exp").textContent=(ok?t.ok:t.ko)+q[o+2];$("exp").classList.remove("hide");
 $("next").textContent=n===flat.length-1?t.res:(n%4===3?t.ns:t.nx);$("next").classList.remove("hide");
}
$("next").onclick=()=>{n++;n<flat.length?load():fin()};
function fin(){const t=T[L],m=flat.length;show("end");$("fs").textContent=s+" / "+m;$("fm").textContent=s>=14?t.f[0]:s>=9?t.f[1]:t.f[2]}
